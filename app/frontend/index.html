<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bot de Promoções</title>
    <style>
      :root {
        --bg: #0f172a;
        --card: #111827;
        --muted: #94a3b8;
        --text: #e5e7eb;
        --accent: #22c55e;
        --warning: #f59e0b;
        --danger: #ef4444;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .container {
        max-width: 1100px;
        margin: 0 auto;
        padding: 32px 20px 64px;
      }
      .header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }
      h1 { margin: 0; font-size: 2rem; }
      .badge {
        background: rgba(34,197,94,0.15);
        color: var(--accent);
        border: 1px solid rgba(34,197,94,0.4);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 0.75rem;
        font-weight: bold;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        margin-bottom: 24px;
      }
      .card {
        background: var(--card);
        border-radius: 14px;
        padding: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      }
      .label {
        color: var(--muted);
        font-size: 0.8rem;
        margin-bottom: 8px;
      }
      .value {
        font-size: 1.7rem;
        font-weight: bold;
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .filter-group {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .filter-btn {
        border: 1px solid rgba(148,163,184,0.35);
        background: rgba(15,23,42,0.7);
        color: var(--text);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 0.8rem;
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .filter-btn.active {
        background: rgba(34,197,94,0.15);
        border-color: rgba(34,197,94,0.5);
        color: var(--accent);
      }
      .table-wrap {
        background: var(--card);
        border-radius: 14px;
        overflow: hidden;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        padding: 14px 16px;
        border-bottom: 1px solid rgba(255,255,255,0.05);
        text-align: left;
      }
      th {
        background: rgba(255,255,255,0.03);
        color: var(--muted);
      }
      .product-cell {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .product-link {
        position: relative;
        color: #e2e8f0;
        text-decoration: none;
        font-weight: 600;
        border-bottom: 1px solid transparent;
        transition: border-color 0.2s ease, color 0.2s ease;
      }
      .product-link:hover {
        color: #7dd3fc;
        border-color: #7dd3fc;
      }
      .product-link::after {
        content: "Abrir site";
        position: absolute;
        left: 0;
        top: -28px;
        white-space: nowrap;
        padding: 5px 8px;
        border-radius: 6px;
        background: rgba(15,23,42,0.95);
        color: #f8fafc;
        font-size: 0.7rem;
        opacity: 0;
        pointer-events: none;
        transform: translateY(4px);
        transition: opacity 0.2s ease, transform 0.2s ease;
        border: 1px solid rgba(125, 211, 252, 0.4);
      }
      .product-link:hover::after {
        opacity: 1;
        transform: translateY(0);
      }
      .action-link {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        background: rgba(59,130,246,0.12);
        color: #bfdbfe;
        border: 1px solid rgba(96,165,250,0.4);
        border-radius: 999px;
        padding: 7px 10px;
        text-decoration: none;
        font-size: 0.75rem;
        font-weight: bold;
      }
      .action-link:hover {
        background: rgba(96,165,250,0.18);
      }
      .pill {
        display: inline-block;
        padding: 6px 10px;
        border-radius: 999px;
        font-size: 0.75rem;
        font-weight: bold;
      }
      .good { background: rgba(34,197,94,0.15); color: var(--accent); }
      .warn { background: rgba(245,158,11,0.15); color: var(--warning); }
      .danger { background: rgba(239,68,68,0.15); color: var(--danger); }
      .trend-cell {
        font-weight: 700;
      }
      .trend-more-barato { color: var(--accent); }
      .trend-mais-caro { color: var(--danger); }
      .trend-igual { color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Bot de Promoções</h1>
        <span class="badge">Monitor ativo</span>
      </div>

      <div class="grid">
        <div class="card">
          <div class="label">Produtos monitorados</div>
          <div class="value" id="productsCount">0</div>
        </div>
        <div class="card">
          <div class="label">Alertas ativos</div>
          <div class="value" id="alertsCount">0</div>
        </div>
        <div class="card">
          <div class="label">Taxa de promoção</div>
          <div class="value" id="promoRate">0%</div>
        </div>
      </div>

      <div class="toolbar">
        <div class="filter-group">
          <button class="filter-btn active" data-filter="all">1. Todos</button>
          <button class="filter-btn" data-filter="promo">2. Promoções</button>
          <button class="filter-btn" data-filter="cheaper">3. Mais baratos</button>
          <button class="filter-btn" data-filter="expensive">4. Mais caros</button>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Produto</th>
              <th>Loja</th>
              <th>Preço Atual</th>
              <th>Variação</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="productRows"></tbody>
        </table>
      </div>
    </div>

    <script>
      let currentFilter = 'all';
      let allProducts = [];

      function applyFilter() {
        const rows = document.querySelectorAll('#productRows tr');
        rows.forEach(row => {
          const show =
            currentFilter === 'all' ||
            (currentFilter === 'promo' && row.dataset.status === 'promo') ||
            (currentFilter === 'cheaper' && row.dataset.priceTrend === 'mais_barato') ||
            (currentFilter === 'expensive' && row.dataset.priceTrend === 'mais_caro');

          row.style.display = show ? '' : 'none';
        });
      }

      async function loadDashboard() {
        const products = await fetch('/products').then(r => r.json());
        allProducts = products;
        const rows = document.getElementById('productRows');
        rows.innerHTML = '';

        document.getElementById('productsCount').textContent = products.length;
        document.getElementById('alertsCount').textContent = products.filter(p => p.promotion_score >= 3).length;

        let promoTotal = 0;
        products.forEach(product => {
          promoTotal += Number(product.promotion_score || 0);
          const tr = document.createElement('tr');
          const isPromo = product.promotion_score >= 3;
          const status = isPromo ? 'Promoção' : 'Normal';
          const pillClass = isPromo ? 'good' : 'warn';
          const productUrl = product.url || '#';
          const productName = product.name || 'Produto';
          const currentPrice = Number(product.current_price ?? product.reference_price ?? 0);
          const variation = product.variation || { delta: 0, percent_change: 0, trend: 'igual' };
          const trendText = variation.trend === 'mais_barato'
            ? `↓ ${Math.abs(variation.percent_change).toFixed(1)}%`
            : variation.trend === 'mais_caro'
              ? `↑ ${Math.abs(variation.percent_change).toFixed(1)}%`
              : `± 0.0%`;
          const trendClass = variation.trend === 'mais_barato' ? 'trend-more-barato' : variation.trend === 'mais_caro' ? 'trend-mais-caro' : 'trend-igual';

          tr.dataset.status = isPromo ? 'promo' : 'normal';
          tr.dataset.priceTrend = variation.trend || 'igual';
          tr.innerHTML = `
            <td>
              <div class="product-cell">
                <a
                  class="product-link"
                  href="${productUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Abrir site do produto"
                >
                  ${productName}
                </a>
                <a
                  class="action-link"
                  href="${productUrl}"
                  target="_blank"
                  rel="noopener noreferrer"
                  title="Abrir site"
                >
                  ↗ Abrir
                </a>
              </div>
            </td>
            <td>${product.store || 'Loja'}</td>
            <td>R$ ${currentPrice.toFixed(2)}</td>
            <td class="trend-cell ${trendClass}">${trendText}</td>
            <td><span class="pill ${pillClass}">${status}</span></td>
          `;
          rows.appendChild(tr);
        });

        applyFilter();

        const avg = products.length ? (promoTotal / products.length) * 20 : 0;
        document.getElementById('promoRate').textContent = `${avg.toFixed(0)}%`;
      }

      document.querySelectorAll('.filter-btn').forEach(button => {
        button.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
          button.classList.add('active');
          currentFilter = button.dataset.filter;
          applyFilter();
        });
      });

      loadDashboard();
      setInterval(loadDashboard, 20000);
    </script>
  </body>
</html>
