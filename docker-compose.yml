version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: pricebot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: price_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d price_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build: .
    container_name: pricebot_api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/price_bot
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build: .
    container_name: pricebot_worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/price_bot
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "python -m app.workers.price_worker"

volumes:
  postgres_data:
